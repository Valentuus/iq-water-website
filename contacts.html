

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Water</title>

    <!-- CSS file for contacts page -->
    <link rel="stylesheet" href="css/contacts.css">

    <!-- Google font used across the website -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap icons used for phone, WhatsApp, messenger and location icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <!-- Header and navigation -->
    <div class="main-site">
        <header>

            <!-- Clickable logo that returns user to main page -->
            <a href="index.html" class="logo">
                <img src="./images/raindrop.png" alt="logo" class="logo-img"> IQ
                <span>Water</span>
            </a>

            <!-- Navigation links between website pages -->
            <nav>
                <a href="index.html" id="nav-home">Main</a>
                <a href="about.html" id="nav-about">About</a>
                <a href="contacts.html" id="nav-contacts">Contacts</a>
            </nav>

        </header>
    </div>

    <!-- Contacts page content -->
    <div class="page-section" id="contacts">

        <!-- Small hero section with page title -->
        <section class="hero-small">
            <h1>Contacts</h1>
        </section>

        <!-- Main contact information area -->
        <div class="container fade-up">
            <div class="contact-grid-page">

                <!-- Contact card with phone and social icons -->
                <div class="contact-card-page">
                    <h3>Contact</h3>

                    <!-- Icons are clickable links -->
                    <div class="contact-icons-row">
                        <a href="tel:+353852778787"><i class="bi bi-telephone"></i></a>
                        <a href="tel:+353852778787"><i class="bi bi-whatsapp"></i></a>
                        <a href="tel:+353852778787"><i class="bi bi-messenger"></i></a>
                    </div>

                    <!-- Main phone number link -->
                    <a href="tel:+353852778787" class="phone-large">
                        +353 (085) 266 88 08
                    </a>
                </div>

                <!-- Location card -->
                <div class="contact-card-page">
                    <i class="bi bi-geo-alt"></i>
                    <p style="font-weight:bold; font-size: 1.1rem; margin-top:10px;">
                        Galway city,<br>Eyre Square
                    </p>
                </div>

                <!-- Online chat contact card -->
                <div class="contact-card-page">
                    <i class="bi bi-whatsapp"></i>
                    <h3>Text us</h3>
                    <p>Online 24/7</p>

                    <!-- Button for future chat function -->
                    <button class="btn-fill telegram-btn">Chat with us</button>
                </div>

            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 IQ Water Systems. All rights reserved.</p>
    </footer>

</body>
</html>
